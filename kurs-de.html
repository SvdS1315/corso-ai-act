ng mit redaktioneller Verantwortung\", \"Eine CE-Kennzeichnung des Textes\"], correct: 1, expl: \"Die Pflicht zur Kennzeichnung als KI-generiert gilt, außer bei menschlicher Prüfung mit redaktioneller Verantwortung für den Inhalt.\" },\n{ id: 9, stem: \"Was hat der Digital Omnibus (VO (EU) 2026/1744) an der Pflicht zur KI-Kompetenz aus Art. 4 konkret geändert?\", opts: [\"Er hat die Schulungspflicht abgeschafft\", \"Er hat klargestellt, dass kein individuelles Kompetenzniveau zertifiziert werden muss, verlangt aber weiterhin verhältnismäßige, dokumentierbare Maßnahmen\", \"Er hat die Schulungspflicht auf Endkunden ausgeweitet\"], correct: 1, expl: \"Der Digital Omnibus hat klargestellt, dass kein individuelles Kompetenzniveau zertifiziert werden muss, verlangt aber weiterhin verhältnismäßige, dokumentierbare Maßnahmen.\" },\n{ id: 10, stem: \"Ein bereits vor dem 2. August 2026 im Verkehr befindliches generatives KI-System bleibt ohne maschinenlesbare Kennzeichnung der generierten Inhalte weiter im Handel. Ist das zulässig?\", opts: [\"Ja, die Kennzeichnungspflicht gilt nur für nach diesem Datum neu in Verkehr gebrachte Systeme\", \"Ja, die Kennzeichnung ist für den Anbieter stets freiwillig\", \"Nein, wenn das System über den 2. Dezember 2026 hinaus im Verkehr bleibt — dem Stichtag auch für bereits bestehende Systeme\"], correct: 2, expl: \"Für bereits im Verkehr befindliche generative Systeme muss die maschinenlesbare Kennzeichnung bis zum 2. Dezember 2026 umgesetzt werden.\" },\n{ id: 11, stem: \"Wer ein KI-System unter eigenem Namen oder eigener Marke in der EU in Verkehr bringt, gilt nach der Verordnung als:\", opts: [\"Betreiber\", \"Anbieter\", \"Einführer\"], correct: 1, expl: \"Anbieter ist, wer ein KI-System entwickelt oder entwickeln lässt und unter eigenem Namen oder Marke in Verkehr bringt oder in Betrieb nimmt.\" },\n{ id: 12, stem: \"Die Pflicht zur KI-Kompetenz aus Art. 4 richtet sich an:\", opts: [\"Nur an Anbieter von Hochrisiko-Systemen\", \"Anbieter und Betreiber, bezogen auf ihr eigenes Personal\", \"Nur an die Aufsichtsbehörden\"], correct: 1, expl: \"Art. 4 verpflichtet sowohl Anbieter als auch Betreiber, ein ausreichendes Maß an KI-Kompetenz ihres Personals sicherzustellen.\" },\n{ id: 13, stem: \"Die Höchststrafen für verbotene Praktiken nach Art. 5 können betragen:\", opts: [\"15 Millionen Euro oder 3 % des weltweiten Umsatzes\", \"35 Millionen Euro oder 7 % des weltweiten Umsatzes\", \"Pauschal 500.000 Euro\"], correct: 1, expl: \"Verbotene Praktiken tragen die höchsten Sanktionen der Verordnung: bis zu 35 Millionen Euro oder 7 % des weltweiten Jahresumsatzes.\" },\n{ id: 14, stem: \"Die Verordnung (EU) 2024/1689 wird allgemein bezeichnet als:\", opts: [\"DSGVO\", \"KI-VO (AI Act)\", \"Digital Services Act\"], correct: 1, expl: \"Die Verordnung (EU) 2024/1689 ist die KI-VO, bekannt als AI Act.\" },\n{ id: 15, stem: \"Ein System, das mit unterschwelligen Techniken das Verhalten einer Person manipuliert und dabei erheblichen Schaden verursachen kann, ist:\", opts: [\"Zulässig, wenn es in den AGB offengelegt wird\", \"Ausnahmslos verboten nach Art. 5\", \"Hochrisiko, zulässig nach Konformitätsbewertung\"], correct: 1, expl: \"Unterschwellige oder manipulative Techniken mit erheblichem Schadenspotenzial sind nach Art. 5 ausnahmslos verboten.\" },\n{ id: 16, stem: \"Die Ausnutzung einer Schwäche aufgrund von Alter oder Behinderung zur Verhaltensverzerrung ist:\", opts: [\"Erlaubt, wenn es gut gemeint ist\", \"Verboten nach Art. 5\", \"Mit Zustimmung eines Vormunds erlaubt\"], correct: 1, expl: \"Die Ausnutzung von Schwächen aufgrund von Alter, Behinderung oder sozialer und wirtschaftlicher Lage ist nach Art. 5 verboten.\" },\n{ id: 17, stem: \"Das durch Art. 5 verbotene \\\"Social Scoring\\\" betrifft:\", opts: [\"Nur von Behörden berechnete Bewertungen\", \"Die Bewertung oder Einstufung von Personen nach Sozialverhalten mit ungerechtfertigter benachteiligender Behandlung\", \"Jedes kommerzielle Empfehlungssystem\"], correct: 1, expl: \"Verbotenes Social Scoring betrifft die Bewertung oder Einstufung von Personen mit anschließender ungerechtfertigter benachteiligender Behandlung.\" },\n{ id: 18, stem: \"Die Vorhersage des Risikos, dass eine Person eine Straftat begeht, allein aufgrund von Profiling ist:\", opts: [\"Zu Präventionszwecken erlaubt\", \"Nach Art. 5 verboten, mit sehr engen Ausnahmen\", \"Nur für Strafverfolgungsbehörden erlaubt\"], correct: 1, expl: \"Die Vorhersage des Straftatenrisikos allein aufgrund von Profiling oder Persönlichkeitsmerkmalen ist nach Art. 5 verboten.\" },\n{ id: 19, stem: \"Die Emotionserkennung ist nach Art. 5 verboten:\", opts: [\"In jedem Kontext, ausnahmslos\", \"Am Arbeitsplatz und in Bildungseinrichtungen, außer aus medizinischen oder Sicherheitsgründen\", \"Nur bei Nutzung zu Werbezwecken\"], correct: 1, expl: \"Das Verbot der Emotionserkennung betrifft den Arbeitsplatz und Bildungseinrichtungen, außer aus medizinischen oder Sicherheitsgründen.\" },\n{ id: 20, stem: \"Die biometrische Kategorisierung zur Ableitung von Rasse, politischen Meinungen oder sexueller Orientierung ist:\", opts: [\"Nach Art. 5 verboten\", \"Erlaubt, wenn anonymisiert\", \"Hochrisiko, erlaubt mit menschlicher Aufsicht\"], correct: 0, expl: \"Die biometrische Kategorisierung zur Ableitung von Rasse, politischen Meinungen, Religion oder sexueller Orientierung ist nach Art. 5 verboten.\" },\n{ id: 21, stem: \"Das ungezielte Auslesen von Gesichtsbildern zum Aufbau von Gesichtserkennungsdatenbanken ist:\", opts: [\"Erlaubt, wenn die Bilder öffentlich zugänglich sind\", \"Nach Art. 5 verboten\", \"Mit Genehmigung der Datenschutzbehörde erlaubt\"], correct: 1, expl: \"Das ungezielte Auslesen von Gesichtsbildern zum Aufbau von Gesichtserkennungsdatenbanken ist nach Art. 5 verboten.\" },\n{ id: 22, stem: \"Die biometrische Echtzeit-Fernidentifizierung im öffentlichen Raum zu Strafverfolgungszwecken ist:\", opts: [\"Immer ausnahmslos verboten\", \"Verboten, außer in eng begrenzten Ausnahmefällen mit vorheriger Genehmigung\", \"Für Strafverfolgungsbehörden immer erlaubt\"], correct: 1, expl: \"Sie ist verboten, außer in eng begrenzten, gesetzlich vorgesehenen Ausnahmefällen mit vorheriger Genehmigung.\" },\n{ id: 23, stem: \"Ab dem 2. Dezember 2026 kommen zu den Verboten des Art. 5 hinzu:\", opts: [\"Das Verbot kommerzieller Chatbots\", \"Die Erzeugung nicht einvernehmlicher intimer Bilder und von Darstellungen sexuellen Kindesmissbrauchs\", \"Das Verbot maschineller Übersetzung\"], correct: 1, expl: \"Die Verordnung (EU) 2026/1744 fügt ab dem 2. Dezember 2026 das Verbot der Erzeugung nicht einvernehmlicher intimer Bilder und von Darstellungen sexuellen Kindesmissbrauchs hinzu.\" },\n{ id: 24, stem: \"Die Transparenzpflicht des Art. 50 für Chatbots gilt:\", opts: [\"Nur wenn der Chatbot Zahlungen entgegennimmt\", \"Wenn die Interaktion mit einem KI-System nicht bereits aus dem Kontext offensichtlich ist\", \"Nur für öffentliche Kundenservice-Chatbots\"], correct: 1, expl: \"Die Offenlegungspflicht gilt, wenn nicht bereits aus dem Kontext offensichtlich ist, dass mit einem KI-System interagiert wird.\" },\n{ id: 25, stem: \"Von KI generierte oder manipulierte Audio-, Video- oder Textinhalte (Deepfakes) müssen:\", opts: [\"Immer verboten werden\", \"Als künstlich erzeugt oder manipuliert gekennzeichnet werden\", \"Binnen 24 Stunden gelöscht werden\"], correct: 1, expl: \"Deepfakes müssen als künstlich erzeugt oder manipuliert gekennzeichnet werden.\" },\n{ id: 26, stem: \"Ein generierter, zur Information der Öffentlichkeit veröffentlichter Text muss als KI-generiert gekennzeichnet werden, außer wenn:\", opts: [\"Er einer menschlichen Prüfung mit redaktioneller Verantwortung unterzogen wurde\", \"Er in eine andere Sprache übersetzt wurde\", \"Er kürzer als 500 Wörter ist\"], correct: 0, expl: \"Die Ausnahme betrifft Texte, die einer menschlichen Prüfung mit redaktioneller Verantwortung für den Inhalt unterzogen wurden.\" },\n{ id: 27, stem: \"Die maschinenlesbare Kennzeichnung von KI-generierten Inhalten obliegt hauptsächlich:\", opts: [\"Dem Endnutzer\", \"Dem Anbieter des Systems\", \"Der nationalen Aufsichtsbehörde\"], correct: 1, expl: \"Die Pflicht zur maschinenlesbaren Kennzeichnung obliegt hauptsächlich dem Anbieter des generativen Systems.\" },\n{ id: 28, stem: \"Ein Sprachmodell kann auf dieselbe Frage zu unterschiedlichen Zeitpunkten unterschiedliche Antworten geben, weil:\", opts: [\"Es gesetzlich zur Variation verpflichtet ist\", \"Es nicht deterministisch ist: es erzeugt Text nach Wahrscheinlichkeit, nicht nach fester Berechnung\", \"Es täglich automatisch die Sprache wechselt\"], correct: 1, expl: \"Modelle erzeugen Text auf Basis von Wahrscheinlichkeiten, nicht durch eine feste deterministische Berechnung.\" },\n{ id: 29, stem: \"Das Hauptrisiko bei der Nutzung eines KI-Chatbots zur Zusammenfassung eines Vertrags ist:\", opts: [\"Die vom System benötigte Zeit\", \"Das stille Auslassen relevanter Klauseln oder Ausnahmen\", \"Die Kosten des Abonnements\"], correct: 1, expl: \"Das Hauptrisiko von Zusammenfassungen ist das stille Auslassen relevanter Klauseln oder Ausnahmen.\" },\n{ id: 30, stem: \"Die Pseudonymisierung von Daten in einem Prompt besteht darin,:\", opts: [\"Die Daten vor dem Schreiben vollständig zu löschen\", \"Identifizierende Angaben durch feste Platzhalter zu ersetzen und die Zuordnung außerhalb des Prompts zu halten\", \"Die Daten in eine andere Sprache zu übersetzen\"], correct: 1, expl: \"Pseudonymisierung ersetzt identifizierende Angaben durch feste Platzhalter und hält die Zuordnung außerhalb des Prompts.\" },\n{ id: 31, stem: \"Nach der DSGVO bleibt ein pseudonymisiertes, aber über andere Informationen weiterhin zuordenbares Datum:\", opts: [\"Kein personenbezogenes Datum mehr\", \"Ein personenbezogenes Datum, das weiterhin verarbeitet wird\", \"Ein anonymes Datum\"], correct: 1, expl: \"Ein pseudonymisiertes, aber weiterhin zuordenbares Datum bleibt nach der DSGVO ein personenbezogenes Datum.\" },\n{ id: 32, stem: \"Die Nutzung nicht freigegebener Browser-Erweiterungen oder privater Konten zur Bearbeitung von Arbeitsdokumenten birgt das Risiko:\", opts: [\"Kein Risiko, wenn das Dokument öffentlich ist\", \"Kontrollverlust über die Daten und ungetrackte Nutzung zum Training fremder Modelle\", \"Nur eine Verlangsamung des Browsers\"], correct: 1, expl: \"Nicht freigegebene Werkzeuge bergen das Risiko von Kontrollverlust über die Daten und ungetrackter Nutzung zum Training fremder Modelle.\" },\n{ id: 33, stem: \"Eine in einem Dokument oder auf einer Webseite versteckte Anweisung, die versucht, einen KI-Assistenten mit Zugriff auf E-Mails oder Dateien zu manipulieren, wird bezeichnet als:\", opts: [\"Syntaxfehler\", \"Prompt Injection\", \"Overfitting\"], correct: 1, expl: \"Diese Technik wird als Prompt Injection bezeichnet.\" },\n{ id: 34, stem: \"Ein von einer KI generiertes Skript, das Operationen auf echten Dateien automatisiert, sollte:\", opts: [\"Sofort auf den Originaldateien ausgeführt werden, um Zeit zu sparen\", \"Zuerst auf Kopien und in getrennten Ordnern getestet werden\", \"Nur nachts ausgeführt werden\"], correct: 1, expl: \"Ein generiertes Skript sollte immer zuerst auf Kopien und in getrennten Ordnern getestet werden.\" },\n{ id: 35, stem: \"Das Risiko algorithmischer Diskriminierung entsteht vor allem dadurch, dass Modelle:\", opts: [\"Absichtlich zur Diskriminierung programmiert sind\", \"Die Ungleichgewichte ihrer Trainingsdaten reproduzieren\", \"Die Beantwortung von Fragen zu Personen verweigern\"], correct: 1, expl: \"Modelle reproduzieren die Ungleichgewichte ihrer Trainingsdaten, einschließlich diskriminierender Verknüpfungen.\" },\n{ id: 36, stem: \"Eine von KI generierte Stellenanzeige mit nach Geschlecht oder Alter ausschließenden Formulierungen verstößt:\", opts: [\"Nur gegen interne Richtlinien der Kanzlei\", \"Auch gegen Antidiskriminierungsrecht, unabhängig vom genutzten Werkzeug\", \"Gegen keine Norm, wenn der Text nicht absichtlich diskriminierend ist\"], correct: 1, expl: \"Antidiskriminierungsrecht gilt unabhängig vom Werkzeug, mit dem der Text erstellt wurde.\" },\n{ id: 37, stem: \"Die Berufshaftung für einen Fehler in einem mit KI-Hilfe erstellten Schriftsatz:\", opts: [\"Geht automatisch auf den Anbieter des Modells über\", \"Bleibt bei der unterschreibenden Fachperson\", \"Ist nicht gegeben, da es sich um einen technischen Fehler handelt\"], correct: 1, expl: \"Die Berufshaftung bleibt bei der unterschreibenden Fachperson und geht nicht auf den Anbieter des Modells über.\" },\n{ id: 38, stem: \"Das Verzeichnis der internen KI-Werkzeuge und -Nutzungen dient dazu:\", opts: [\"Zu dokumentieren, welche Systeme für welche Tätigkeiten von wem genutzt werden\", \"Den Vertrag mit dem Anbieter zu ersetzen\", \"Die Abonnementkosten zu berechnen\"], correct: 0, expl: \"Das Verzeichnis dokumentiert, welche Systeme für welche Tätigkeiten von wem genutzt werden, und ist Teil der geforderten Dokumentation.\" },\n{ id: 39, stem: \"Für ein Hochrisiko-System verlangt Art. 26(2), dass die menschliche Aufsicht Personen übertragen wird mit:\", opts: [\"Einem Informatikabschluss\", \"Angemessener Kompetenz, Schulung, Ressourcen und Befugnis\", \"Einer speziellen Berufshaftpflichtversicherung\"], correct: 1, expl: \"Art. 26(2) verlangt, dass die menschliche Aufsicht Personen mit angemessener Kompetenz, Schulung, Ressourcen und Befugnis übertragen wird.\" },\n{ id: 40, stem: \"Zeigt ein Hochrisiko-System ein anomales Verhalten mit Risikopotenzial, muss der Betreiber:\", opts: [\"Ohne einzugreifen auf ein Update des Anbieters warten\", \"Den Anbieter unverzüglich informieren und die Nutzung erforderlichenfalls aussetzen\", \"Die Nutzung fortsetzen und dies erst im Nachhinein dokumentieren\"], correct: 1, expl: \"Art. 26(5) verlangt, den Anbieter unverzüglich zu informieren und die Nutzung erforderlichenfalls auszusetzen.\" }\n];\n\nclass Component extends DCLogic {\n  state = { antworten: {}, module: {}, name: '', rolle: '', auswahl: null };\n\n  key = 'kurs-ki-vo-de';\n\n  modulIds = ['m1','m2','m3','m4','m5','m6','m7'];\n\n  ziehen() {\n    const idx = BANK_DE.map((_, i) => i);\n    for (let i = idx.length - 1; i > 0; i--) {\n      const j = Math.floor(Math.random() * (i + 1));\n      [idx[i], idx[j]] = [idx[j], idx[i]];\n    }\n    return idx.slice(0, 10).map(i => BANK_DE[i].id);\n  }\n\n  componentDidMount() {\n    try {\n      const gespeichert = window.localStorage.getItem(this.key);\n      if (gespeichert) {\n        const daten = JSON.parse(gespeichert);\n        this.setState({\n          antworten: daten.antworten || {},\n          module: daten.module || {},\n          name: daten.name || '',\n          rolle: daten.rolle || '',\n          auswahl: daten.auswahl || null\n        });\n      }\n    } catch (e) {}\n    if (!this.state.auswahl) {\n      this.aktualisieren({ auswahl: this.ziehen() });\n    }\n  }\n\n  speichern(next) {\n    try { window.localStorage.setItem(this.key, JSON.stringify(next)); } catch (e) {}\n  }\n\n  aktualisieren(patch) {\n    this.setState(s => {\n      const next = Object.assign({}, s, patch);\n      this.speichern({ antworten: next.antworten, module: next.module, name: next.name, rolle: next.rolle, auswahl: next.auswahl });\n      return patch;\n    });\n  }\n\n  renderVals() {\n    const auswahl = this.state.auswahl || BANK_DE.slice(0, 10).map(q => q.id);\n    const buchstaben = ['A', 'B', 'C'];\n\n    const domande = auswahl.map((id, i) => {\n      const q = BANK_DE.find(x => x.id === id);\n      const gewaehlt = this.state.antworten[id];\n      let feedback = '';\n      if (gewaehlt !== undefined) {\n        const ok = gewaehlt === q.correct;\n        feedback = (ok ? 'Richtig. ' : 'Falsch: richtig ist ' + buchstaben[q.correct] + '. ') + q.expl;\n      }\n      return {\n        numero: i + 1,\n        stem: q.stem,\n        feedback,\n        opzioni: q.opts.map((testo, oi) => ({\n          etichetta: buchstaben[oi],\n          testo,\n          scegli: () => this.aktualisieren({ antworten: Object.assign({}, this.state.antworten, { [id]: oi }) })\n        }))\n      };\n    });\n\n    const segna = {};\n    const gelesen = {};\n    this.modulIds.forEach(m => {\n      const fertig = !!this.state.module[m];\n      gelesen[m] = fertig ? 'Modul abgeschlossen' : 'Als gelesen markieren';\n      segna[m] = () => this.aktualisieren({ module: Object.assign({}, this.state.module, { [m]: !fertig }) });\n    });\n\n    const fertig = this.modulIds.filter(m => this.state.module[m]).length;\n    const beantwortet = auswahl.filter(id => this.state.antworten[id] !== undefined).length;\n    const korrekt = auswahl.filter(id => {\n      const q = BANK_DE.find(x => x.id === id);\n      return this.state.antworten[id] === q.correct;\n    }).length;\n\n    let ergebnis = 'Test noch nicht abgeschlossen';\n    if (beantwortet === auswahl.length) ergebnis = korrekt >= 8 ? 'Bestanden: ' + korrekt + '/10' : 'Nicht bestanden: ' + korrekt + '/10';\n    else if (beantwortet > 0) ergebnis = beantwortet + ' von 10 Fragen beantwortet';\n\n    return {\n      domande,\n      segna,\n      gelesen,\n      name: this.state.name,\n      rolle: this.state.rolle,\n      setName: e => this.aktualisieren({ name: e.target.value }),\n      setRolle: e => this.aktualisieren({ rolle: e.target.value }),\n      fortschrittPct: Math.round((fertig / this.modulIds.length) * 100) + '%',\n      fortschrittText: fertig + ' von ' + this.modulIds.length + ' Modulen',\n      punktzahl: beantwortet === 0 ? 'Keine Antwort' : korrekt + ' von ' + beantwortet + ' richtig',\n      ergebnis,\n      heute: new Date().toLocaleDateString('de-DE'),\n      reset: () => this.aktualisieren({ antworten: {} }),\n      neuerVersuch: () => this.aktualisieren({ antworten: {}, auswahl: this.ziehen() }),\n      drucken: () => window.print()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
