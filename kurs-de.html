document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"width: 168px; height: auto;\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.006 60);\">Fortschritt<\u002Fdiv>\n      <div style=\"height: 6px; background: oklch(0.925 0.006 78); border-radius: 999px; overflow: hidden;\">\n        <div style=\"height: 6px; background: oklch(0.58 0.13 35); width: {{ fortschrittPct }};\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 13px; color: oklch(0.42 0.006 60);\">{{ fortschrittText }}<\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display: flex; flex-direction: column; gap: 2px;\">\n      <a href=\"#m0\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.42 0.006 60);\" style-hover=\"background: oklch(0.945 0.005 78);\">Warum dieser Kurs<\u002Fa>\n      <a href=\"#m1\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.42 0.006 60);\" style-hover=\"background: oklch(0.945 0.005 78);\">01 · Rechtsrahmen<\u002Fa>\n      <a href=\"#m2\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.42 0.006 60);\" style-hover=\"background: oklch(0.945 0.005 78);\">02 · Werkzeuge und Grenzen<\u002Fa>\n      <a href=\"#m3\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.42 0.006 60);\" style-hover=\"background: oklch(0.945 0.005 78);\">03 · Verbotene Praktiken<\u002Fa>\n      <a href=\"#m4\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.42 0.006 60);\" style-hover=\"background: oklch(0.945 0.005 78);\">04 · Transparenz und Aufsicht<\u002Fa>\n      <a href=\"#m5\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.42 0.006 60);\" style-hover=\"background: oklch(0.945 0.005 78);\">05 · Daten, Sicherheit, Bias<\u002Fa>\n      <a href=\"#m6\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.42 0.006 60);\" style-hover=\"background: oklch(0.945 0.005 78);\">06 · Dokumentation<\u002Fa>\n      <a href=\"#m7\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.42 0.006 60);\" style-hover=\"background: oklch(0.945 0.005 78);\">07 · Hochrisiko-Systeme<\u002Fa>\n      <a href=\"#quiz\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.18 0.005 60); font-weight: 500;\" style-hover=\"background: oklch(0.945 0.005 78);\">Abschlusstest<\u002Fa>\n      <a href=\"#nachweis\" style=\"font-size: 14px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: oklch(0.42 0.006 60);\" style-hover=\"background: oklch(0.945 0.005 78);\">Teilnahmenachweis<\u002Fa>\n    <\u002Fnav>\n    <div style=\"margin-top: auto; font-size: 12px; line-height: 1.6; color: oklch(0.58 0.006 60);\">Altea GmbH · Altea Lex<br>Ausgabe August 2026<\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 0 48px 120px;\">\n    <div style=\"width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 24px;\">\n\n      <header style=\"padding: 88px 0 40px; display: flex; flex-direction: column; gap: 22px; border-bottom: 1px solid oklch(0.90 0.006 78);\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Pflichtschulung — Art. 4 VO (EU) 2024/1689<\u002Fdiv>\n        <h1 style=\"font-family: 'Newsreader', serif; font-size: 56px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; margin: 0; max-width: 24ch;\">KI-Kompetenz im Umgang mit künstlicher Intelligenz<\u002Fh1>\n        <p style=\"font-size: 20px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0; max-width: 56ch;\">Selbstlernkurs für alle Mitarbeitenden, die KI-Systeme in ihrer Arbeit nutzen. Lesedauer rund 75 Minuten, Abschlusstest mit 10 Fragen, Nachweis zum Aufbewahren.<\u002Fp>\n        <div style=\"display: flex; gap: 40px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.006 60); padding-top: 6px;\">\n          <span>7 Module<\u002Fspan>\n          <span>Bestehensgrenze: 8 von 10 Fragen<\u002Fspan>\n          <span>Fortschritt auf diesem Gerät gespeichert<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fheader>\n\n      <section id=\"m0\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 20px;\">\n        <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Warum dieser Kurs<\u002Fh2>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Art. 4 der KI-Verordnung verlangt von Anbietern und Betreibern Maßnahmen, um ein ausreichendes Maß an KI-Kompetenz ihres Personals zu gewährleisten — unter Berücksichtigung von technischen Kenntnissen, Erfahrung, Ausbildung und Einsatzkontext. Die Pflicht gilt seit dem 2. Februar 2025.<\u002Fp>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Die Verordnung (EU) 2026/1744, in Kraft seit dem 27. Juli 2026, hat den Artikel neu gefasst und klargestellt, dass kein zertifiziertes individuelles Kompetenzniveau nachzuweisen ist. Verlangt bleiben rollenangemessene Maßnahmen und die Fähigkeit, sie zu dokumentieren: dieser Kurs, das Verzeichnis der eingesetzten Systeme und der Teilnahmenachweis sind diese Maßnahmen.<\u002Fp>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Konkret: wer ein KI-Werkzeug beruflich nutzt, muss dessen Funktionsweise und Grenzen kennen, die Risiken erkennen und wissen, wann er innehält und nachfragt.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"m1\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Modul 01<\u002Fdiv>\n          <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Rechtsrahmen und Fristen<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Die KI-Verordnung stuft Systeme nach Risiko ein und verteilt die Pflichten zwischen Anbietern und Betreibern. Die Pflicht zur KI-Kompetenz gilt auf jeder Stufe, auch bei Systemen mit minimalem Risiko.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-top: 3px solid oklch(0.55 0.17 25); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 17px; font-weight: 500;\">Unannehmbares Risiko<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Ausnahmslos verboten: Art. 5, anwendbar seit dem 2. Februar 2025. Weder Vertrag noch Einwilligung erlauben es.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-top: 3px solid oklch(0.72 0.13 75); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 17px; font-weight: 500;\">Hohes Risiko<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Zulässig unter strengen Pflichten. Für Nutzende gilt Art. 26. Anhang III anwendbar ab dem 2. Dezember 2027.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-top: 3px solid oklch(0.58 0.10 240); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 17px; font-weight: 500;\">Transparenzrisiko<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Chatbots, generierte Inhalte, Deepfakes: Art. 50, anwendbar seit dem 2. August 2026. Hier liegt unsere tägliche Nutzung.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-top: 3px solid oklch(0.84 0.008 78); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 17px; font-weight: 500;\">Minimales Risiko<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Keine spezifischen Pflichten aus der KI-VO. DSGVO, Berufsgeheimnis und Verträge gelten weiter.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 0;\">\n          <div style=\"display: grid; grid-template-columns: 150px 1fr; gap: 24px; padding: 12px 0; border-top: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.58 0.13 35);\">2. Feb 2025<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Verbote nach Art. 5 und Pflicht zur KI-Kompetenz nach Art. 4: bereits anwendbar.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px 1fr; gap: 24px; padding: 12px 0; border-top: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.42 0.006 60);\">2. Aug 2025<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Pflichten für KI-Modelle mit allgemeinem Verwendungszweck und Governance-Regeln.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px 1fr; gap: 24px; padding: 12px 0; border-top: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.58 0.13 35);\">2. Aug 2026<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Transparenzpflichten nach Art. 50 anwendbar und durch die nationalen Behörden durchsetzbar.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px 1fr; gap: 24px; padding: 12px 0; border-top: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.42 0.006 60);\">2. Dez 2026<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Maschinenlesbare Markierung für bereits im Verkehr befindliche generative Systeme, dazu zwei neue Verbote in Art. 5.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px 1fr; gap: 24px; padding: 12px 0; border-top: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.42 0.006 60);\">2. Dez 2027<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Pflichten für Hochrisiko-Systeme nach Anhang III, verschoben vom 2. August 2026.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 150px 1fr; gap: 24px; padding: 12px 0; border-top: 1px solid oklch(0.90 0.006 78); border-bottom: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.42 0.006 60);\">2. Aug 2028<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Hochrisiko-KI als Sicherheitsbauteil in Produkten, die dem Recht nach Anhang I unterliegen.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">In unserer Rolle sind wir Betreiber: wir nutzen fremde Systeme unter eigener beruflicher Verantwortung. Die Betreiberpflichten sind unsere Pflichten und gehen nicht vertraglich auf den Anbieter über. Nach Art. 25 wird man Anbieter, wenn man ein System unter eigenem Namen anbietet, es wesentlich verändert oder für einen Hochrisiko-Zweck einsetzt.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ segna.m1 }}\" style=\"align-self: flex-start; font-size: 15px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.84 0.008 78); border-radius: 6px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: oklch(0.30 0.005 60);\" class=\"no-print\">{{ gelesen.m1 }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"m2\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Modul 02<\u002Fdiv>\n          <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Unsere Werkzeuge und ihre Grenzen<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"display: grid; grid-template-columns: 0.8fr 1.3fr 1.3fr; gap: 24px; padding-bottom: 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.006 60);\"><span>Werkzeug<\u002Fspan><span>Vorgesehene Nutzung<\u002Fspan><span>Zu beachtende Grenze<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 0.8fr 1.3fr 1.3fr; gap: 24px; padding: 14px 0; border-top: 1px solid oklch(0.90 0.006 78); font-size: 15px; line-height: 1.6;\"><span style=\"font-weight: 500;\">Claude<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Entwürfe von Schreiben und Memos, Zusammenfassungen, Umformulierungen, Übersetzungen zwischen Italienisch und Deutsch.<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Kann Normen und Urteile erfinden oder veraltet zitieren — im überzeugenden Ton.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 0.8fr 1.3fr 1.3fr; gap: 24px; padding: 14px 0; border-top: 1px solid oklch(0.90 0.006 78); font-size: 15px; line-height: 1.6;\"><span style=\"font-weight: 500;\">Claude in VS Code<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Skripte, Automatisierungen, Tabellen, Dateiverarbeitung.<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Liest die Dateien des geöffneten Ordners: enthält er Mandantendaten, verlassen diese die Kanzlei.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 0.8fr 1.3fr 1.3fr; gap: 24px; padding: 14px 0; border-top: 1px solid oklch(0.90 0.006 78); font-size: 15px; line-height: 1.6;\"><span style=\"font-weight: 500;\">GitHub Copilot<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Code-Vervollständigung in der internen Entwicklung.<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Schlägt plausiblen, aber ungeprüften und teils unsicheren Code vor.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 0.8fr 1.3fr 1.3fr; gap: 24px; padding: 14px 0; border-top: 1px solid oklch(0.90 0.006 78); font-size: 15px; line-height: 1.6;\"><span style=\"font-weight: 500;\">ChatGPT<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Allgemeine Texte, Erklärungen, erste Entwürfe.<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Gleiches Erfindungsrisiko. Achtung bei Verlauf, Memory und Kontoeinstellungen.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 0.8fr 1.3fr 1.3fr; gap: 24px; padding: 14px 0; border-top: 1px solid oklch(0.90 0.006 78); border-bottom: 1px solid oklch(0.90 0.006 78); font-size: 15px; line-height: 1.6;\"><span style=\"font-weight: 500;\">Perplexity<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Recherche mit Quellenangaben, erste Orientierung.<\u002Fspan><span style=\"color: oklch(0.42 0.006 60);\">Quellen müssen geöffnet und gelesen werden: die Zusammenfassung kann von der Quelle abweichen.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Vier technische Eigenschaften erklären alle typischen Fehler. Die Modelle sagen die wahrscheinlichste Fortsetzung des Textes voraus und wissen nichts: ein erfundener Paragraf sieht aus wie ein echter. Sie haben einen Wissensstichtag, sind bei neuen Normen also womöglich veraltet. Sie sind nicht reproduzierbar: dieselbe Frage kann verschiedene Antworten liefern. Und sie folgen dem Fragenden: eine Bitte um Bestätigung erzeugt Bestätigungen, keine Prüfung.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Rechtsquellen<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Plausible, aber nicht existierende oder aufgehobene Vorschriften und Urteile: jede Fundstelle in der amtlichen Quelle prüfen.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Terminologie IT/DE<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Italienische und deutsche Rechtsinstitute entsprechen sich nicht: das Modell übersetzt Wörter, nicht Institute.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Zahlen und Fristen<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Beträge, Sätze und Termine sehen geordnet aus und sind falsch: nachrechnen, nicht nachlesen.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Zusammenfassungen<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Stilles Auslassen von Klauseln oder Ausnahmen: sie ersetzen die Lektüre des Dokuments nicht.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Code und Automatisierungen<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Skripte, die an Randfällen scheitern oder an falscher Stelle schreiben: nur auf Kopien testen.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ segna.m2 }}\" style=\"align-self: flex-start; font-size: 15px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.84 0.008 78); border-radius: 6px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: oklch(0.30 0.005 60);\" class=\"no-print\">{{ gelesen.m2 }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"m3\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Modul 03<\u002Fdiv>\n          <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Verbotene Praktiken: Art. 5<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Acht Einsatzformen von KI sind in der Union seit dem 2. Februar 2025 verboten — mit den höchsten Sanktionen der Verordnung: bis zu 35 Millionen Euro oder 7 % des weltweiten Jahresumsatzes.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px 32px;\">\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">01<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Unterschwellige, manipulative oder täuschende Techniken, die das Verhalten verzerren und erheblichen Schaden verursachen können.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">05<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Emotionserkennung am Arbeitsplatz und in Bildungseinrichtungen, außer aus medizinischen oder Sicherheitsgründen.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">02<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Ausnutzung von Schwächen aufgrund von Alter, Behinderung oder sozialer und wirtschaftlicher Lage.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">06<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Biometrische Kategorisierung zur Ableitung von Rasse, politischer Meinung, Gewerkschaftszugehörigkeit, Religion oder Sexualleben.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">03<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Social Scoring: Bewertung von Personen nach Verhalten oder persönlichen Merkmalen mit benachteiligender Behandlung.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">07<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Ungezieltes Auslesen von Gesichtsbildern aus dem Internet oder von Überwachungsaufnahmen zum Aufbau von Gesichtserkennungsdatenbanken.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">04<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Vorhersage von Straftatenrisiken allein auf Grundlage von Profiling oder Persönlichkeitsmerkmalen.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">08<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Biometrische Echtzeit-Fernidentifizierung in öffentlichen Räumen zu Strafverfolgungszwecken, außer in engen Ausnahmefällen.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.94 0.04 35); border: 1px solid oklch(0.58 0.13 35); border-radius: 8px; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px;\">\n          <p style=\"font-size: 16px; line-height: 1.6; color: oklch(0.18 0.005 60); margin: 0;\">Ab dem 2. Dezember 2026 kommen zwei Verbote aus der Verordnung (EU) 2026/1744 hinzu: die Erzeugung nicht einvernehmlicher intimer Bilder und von Darstellungen sexuellen Kindesmissbrauchs.<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 1.6; color: oklch(0.18 0.005 60); margin: 0;\">Für eine Kanzlei wie unsere zählen vor allem zwei Verbote: die Analyse von Stimme, Gesicht oder Text zur Ableitung von Emotionen bei Mitarbeitenden und Bewerbern, sowie allgemeine Zuverlässigkeits-Scores über Personen, die zu benachteiligenden Entscheidungen führen. Das Verbot gilt auch, wenn ein Mandant es wünscht, und auch, wenn das Werkzeug schon beschafft ist.<\u002Fp>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ segna.m3 }}\" style=\"align-self: flex-start; font-size: 15px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.84 0.008 78); border-radius: 6px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: oklch(0.30 0.005 60);\" class=\"no-print\">{{ gelesen.m3 }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"m4\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Modul 04<\u002Fdiv>\n          <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Transparenz und menschliche Aufsicht<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Interaktion mit KI<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Wer mit einem KI-System spricht, muss es wissen, sofern es nicht offensichtlich ist. Gilt für Chatbots und Assistenten auf Website, per E-Mail oder Telefon.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Synthetische Inhalte<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Generierte Texte, Bilder, Audio und Video sind maschinenlesbar zu markieren: Anbieterpflicht, mit Frist bis 2. Dezember 2026 für bereits im Verkehr befindliche Systeme.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Deepfakes<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Wer Inhalte verbreitet, die reale Personen, Orte oder Ereignisse nachbilden, muss offenlegen, dass sie künstlich erzeugt oder manipuliert sind.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Texte von öffentlichem Interesse<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Generierte Texte, die zur Information der Öffentlichkeit veröffentlicht werden, sind zu kennzeichnen — außer bei menschlicher Prüfung mit redaktioneller Verantwortung.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Im Alltag: aktivieren wir einen automatischen Assistenten nach außen, muss er sich als automatisches System erkennbar machen und den Wechsel zu einer Person ermöglichen. Generierte Bilder, Audios oder Videos, die wir veröffentlichen, werden als solche gekennzeichnet. Ein Entwurf, den wir prüfen, korrigieren und unterschreiben, bleibt unser berufliches Werk: Art. 50 verlangt keine Offenlegung des genutzten Werkzeugs, die Verantwortung liegt aber bei uns.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;\">\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-top: 3px solid oklch(0.58 0.13 35); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 16px; font-weight: 500;\">Alles lesen<\u002Fdiv>\n            <p style=\"font-size: 14px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Kein Ergebnis verlässt die Kanzlei ohne vollständige Lektüre durch die absendende Person.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-top: 3px solid oklch(0.58 0.13 35); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 16px; font-weight: 500;\">An der Quelle prüfen<\u002Fdiv>\n            <p style=\"font-size: 14px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Normen, Urteile, Zahlen und Fristen werden in der amtlichen Quelle kontrolliert.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-top: 3px solid oklch(0.58 0.13 35); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 16px; font-weight: 500;\">Selbst entscheiden<\u002Fdiv>\n            <p style=\"font-size: 14px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Die fachliche Bewertung bleibt bei der Person: das Werkzeug schlägt nur vor.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-top: 3px solid oklch(0.58 0.13 35); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 16px; font-weight: 500;\">Innehalten können<\u002Fdiv>\n            <p style=\"font-size: 14px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Im Zweifel wird die Nutzung ausgesetzt und nachgefragt — vor dem Versand und vor der Unterschrift.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ segna.m4 }}\" style=\"align-self: flex-start; font-size: 15px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.84 0.008 78); border-radius: 6px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: oklch(0.30 0.005 60);\" class=\"no-print\">{{ gelesen.m4 }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"m5\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Modul 05<\u002Fdiv>\n          <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Personendaten, Sicherheit, Diskriminierung<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.94 0.04 35); border: 1px solid oklch(0.58 0.13 35); border-radius: 8px; padding: 26px; display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"font-size: 19px; font-weight: 500;\">Pseudonymisierung vor dem Prompt<\u002Fdiv>\n          <p style=\"font-size: 16px; line-height: 1.7; color: oklch(0.18 0.005 60); margin: 0;\">Aus dem Prompt bleiben heraus: Namen von Mandanten, Mitarbeitenden und Gegenseiten, IBAN und Bankdaten, Steuernummern und Codice fiscale, Adressen, Geburtsdaten, Kontaktdaten, Ausweisnummern, Firmennamen und jeder Hinweis, der den Fall erkennbar macht. Ersetzt wird durch feste Platzhalter — Mandant A, Mitarbeiter 1, Betrag X — die Zuordnung bleibt in der Akte.<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 1.7; color: oklch(0.18 0.005 60); margin: 0;\">Das gilt auch für Anhänge und Screenshots, für in VS Code geöffnete Ordner und für schnelles Einfügen im Chat. Bei besonderen Kategorien personenbezogener Daten, etwa Gesundheit oder Gewerkschaftszugehörigkeit, genügt Pseudonymisierung nicht. Nach der DSGVO bleibt auch das pseudonymisierte Datum eine Verarbeitung — die Maßnahme senkt das Risiko, sie beseitigt es nicht.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 16px; font-weight: 500;\">Nicht freigegebene Werkzeuge<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Private Konten, Browser-Erweiterungen, Gratis-Apps: wir wissen nicht, wohin die Daten gehen und ob sie zum Training genutzt werden. Nur freigegebene Werkzeuge nutzen.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 16px; font-weight: 500;\">Versteckte Anweisungen in Dokumenten<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Eine Datei oder Webseite kann Anweisungen an das Modell enthalten. Hat ein Assistent Zugriff auf E-Mails oder Ordner, werden Aktionen einzeln freigegeben.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 16px; font-weight: 500;\">Verlauf und Memory<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Konversationen und Memory-Funktionen speichern, was wir geschrieben haben. Was nicht gespeichert werden darf, darf nicht geschrieben werden.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-size: 16px; font-weight: 500;\">Automatisierungen auf Echtdaten<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0;\">Ein generiertes Skript kann löschen oder überschreiben: nur auf Kopien und in getrennten Ordnern testen, nie im Kanzleiarchiv.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Zur Diskriminierung: Modelle reproduzieren die Ungleichgewichte ihrer Trainingsdaten, einschließlich der Verknüpfungen von Rolle, Geschlecht, Alter und Herkunft. Bei uns zeigt sich das in Stellenanzeigen mit ausschließenden Formulierungen, in vom Modell vorgeschlagenen Rangfolgen oder Bewertungen, in Übersetzungen, die Stereotype einführen. Keine Entscheidung über Personen stützt sich auf das Ergebnis, und jeder Text über Bewerber oder Mitarbeitende wird auch mit Blick auf Gleichbehandlung gelesen. Das AGG und die italienischen Antidiskriminierungsvorschriften gelten unabhängig davon, mit welchem Werkzeug der Text geschrieben wurde.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ segna.m5 }}\" style=\"align-self: flex-start; font-size: 15px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.84 0.008 78); border-radius: 6px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: oklch(0.30 0.005 60);\" class=\"no-print\">{{ gelesen.m5 }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"m6\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Modul 06<\u002Fdiv>\n          <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Dokumentation und Verantwortung<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"display: grid; grid-template-columns: 250px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Verzeichnis der Werkzeuge und Nutzungen<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Welche Systeme wir nutzen, für welche Tätigkeiten, wer sie nutzt, mit welchem Konto. Es wird bei jeder Änderung aktualisiert.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 250px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Nachweis der Schulung<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Inhalt, Datum, Teilnehmende mit Unterschrift, Testergebnis: das ist die von Art. 4 verlangte Maßnahme und ist aufzubewahren.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 250px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Meldungen und Vorfälle<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Relevante Fehler, versehentlich abgeflossene Daten, falsche Ergebnisse in Schriftsätzen: Datum, Sachverhalt, Maßnahmen. Auch zur Prüfung der DSGVO-Meldepflichten.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 250px 1fr; gap: 24px; border-bottom: 1px solid oklch(0.90 0.006 78); padding-bottom: 12px;\"><span style=\"font-size: 16px; font-weight: 500;\">Entscheidungen über neue Werkzeuge<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Wer was unter welchen Bedingungen freigegeben hat, mit den Betriebsanleitungen des Anbieters bei der Freigabe.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Die Verantwortung gegenüber dem Mandanten bleibt vollständig bei uns. Keine Vertragsklausel des Anbieters überträgt sie, und der Einsatz eines KI-Werkzeugs mindert die Berufshaftung für ein falsches Werk nicht.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ segna.m6 }}\" style=\"align-self: flex-start; font-size: 15px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.84 0.008 78); border-radius: 6px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: oklch(0.30 0.005 60);\" class=\"no-print\">{{ gelesen.m6 }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"m7\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Modul 07<\u002Fdiv>\n          <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Hochrisiko-Systeme: Art. 26<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size: 17px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Heute nutzen wir keine Hochrisiko-Systeme. Würden wir ein Werkzeug für Personalauswahl, Leistungsbewertung, Zugang zu Leistungen oder Biometrie einsetzen, wären diese Pflichten unsere.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px 32px;\">\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">26(1)<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Das System gemäß den Betriebsanleitungen des Anbieters nutzen, mit geeigneten technischen und organisatorischen Maßnahmen.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">26(5)<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Den Betrieb überwachen, Anbieter und Behörden bei Risiken oder schweren Vorfällen unverzüglich informieren, die Nutzung erforderlichenfalls aussetzen.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">26(2)<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Die menschliche Aufsicht Personen mit der erforderlichen Kompetenz, Schulung, Ressourcen und Befugnis übertragen — hier ist Schulung ausdrückliche Voraussetzung.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">26(6)<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Automatisch erzeugte Protokolle mindestens sechs Monate aufbewahren, sofern andere Vorschriften keine längere Frist verlangen.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">26(4)<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Sicherstellen, dass die Eingabedaten der Zweckbestimmung des Systems entsprechen und hinreichend repräsentativ sind.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 14px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.58 0.13 35); padding-top: 3px;\">26(9)<\u002Fspan><span style=\"font-size: 15px; line-height: 1.6; color: oklch(0.42 0.006 60);\">Die Angaben des Anbieters für die Datenschutz-Folgenabschätzung nach Art. 35 DSGVO nutzen, soweit erforderlich.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: oklch(0.94 0.04 35); border: 1px solid oklch(0.58 0.13 35); border-radius: 8px; padding: 22px 26px; display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.46 0.12 35);\">Art. 26(7) — Pflicht des Arbeitgebers<\u002Fdiv>\n          <p style=\"font-size: 16px; line-height: 1.7; color: oklch(0.18 0.005 60); margin: 0;\">Vor Inbetriebnahme oder Nutzung eines Hochrisiko-KI-Systems am Arbeitsplatz informiert der Arbeitgeber die Arbeitnehmervertretung und die betroffenen Arbeitnehmer darüber, dass sie dem System unterliegen — nach den Verfahren des Unionsrechts und des nationalen Rechts. Nach Art. 86 haben betroffene Personen zudem Anspruch auf Erläuterung der mit Hilfe des Systems getroffenen Entscheidungen.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"font-size: 17px; font-weight: 500;\">Fünf Fragen vor der Einführung eines neuen Werkzeugs<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.58 0.13 35);\">01<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Bewertet, selektiert, klassifiziert oder überwacht das Werkzeug Personen?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.58 0.13 35);\">02<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Dient es Entscheidungen über Einstellung, Aufgaben, Beförderung, Beendigung oder Zugang zu Leistungen?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.58 0.13 35);\">03<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Verarbeitet es biometrische Daten, Emotionen oder besondere Datenkategorien?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.58 0.13 35);\">04<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Liefert der Anbieter Betriebsanleitungen, Angaben zu Grenzen und einsehbare Protokolle?<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid oklch(0.90 0.006 78); border-bottom: 1px solid oklch(0.90 0.006 78);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; color: oklch(0.58 0.13 35);\">05<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6;\">Würden wir das System verändern oder für einen anderen als den vorgesehenen Zweck nutzen?<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size: 16px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Eine einzige Ja-Antwort auf die ersten drei Fragen deutet auf ein mögliches Hochrisiko-System hin: die Einstufung ist vor der Einführung zu prüfen.<\u002Fp>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ segna.m7 }}\" style=\"align-self: flex-start; font-size: 15px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.84 0.008 78); border-radius: 6px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: oklch(0.30 0.005 60);\" class=\"no-print\">{{ gelesen.m7 }}<\u002Fbutton>\n      <\u002Fsection>\n\n      <section id=\"quiz\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 28px;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Abschlusstest<\u002Fdiv>\n            <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Zehn Fragen, gezogen aus einem Pool von 40<\u002Fh2>\n            <p style=\"font-size: 16px; line-height: 1.6; color: oklch(0.42 0.006 60); margin: 0; max-width: 60ch;\">Bestehensgrenze: 8 richtige Antworten von 10. Die Auflösung erscheint direkt nach jeder Antwort. Jeder neue Versuch zieht 10 neue Fragen.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 16px;\" class=\"no-print\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; color: oklch(0.42 0.006 60);\">{{ punktzahl }}<\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"font-size: 15px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.84 0.008 78); border-radius: 6px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: oklch(0.30 0.005 60);\">Zurücksetzen<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ neuerVersuch }}\" style=\"font-size: 15px; color: oklch(0.99 0.005 80); background: oklch(0.58 0.13 35); border: 1px solid oklch(0.30 0.005 60); border-radius: 6px; padding: 10px 18px; cursor: pointer;\" style-hover=\"background: oklch(0.52 0.13 35);\">Neue 10 Fragen<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n          <sc-for list=\"{{ domande }}\" as=\"d\" hint-placeholder-count=\"10\">\n          <div style=\"background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 10px;\">\n            <div style=\"font-size: 17px; font-weight: 500; line-height: 1.5;\">{{ d.numero }}. {{ d.stem }}<\u002Fdiv>\n            <sc-for list=\"{{ d.opzioni }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ o.scegli }}\" style=\"text-align: left; font-size: 15px; line-height: 1.5; color: oklch(0.18 0.005 60); background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 6px; padding: 10px 14px; cursor: pointer;\" style-hover=\"border-color: oklch(0.84 0.008 78);\">{{ o.etichetta }}. {{ o.testo }}<\u002Fbutton>\n            <\u002Fsc-for>\n            <div style=\"font-size: 14px; line-height: 1.6; color: oklch(0.42 0.006 60); min-height: 22px;\">{{ d.feedback }}<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"nachweis\" style=\"background: oklch(0.985 0.003 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 10px; padding: 44px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 32px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.13 35);\">Schulungsnachweis<\u002Fdiv>\n            <h2 style=\"font-family: 'Newsreader', serif; font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin: 0;\">Teilnahmenachweis<\u002Fh2>\n            <p style=\"font-size: 16px; line-height: 1.7; color: oklch(0.42 0.006 60); margin: 0; max-width: 68ch;\">Kurs KI-Kompetenz im Umgang mit künstlicher Intelligenz, Maßnahme nach Art. 4 der Verordnung (EU) 2024/1689. Ausfüllen, ausdrucken und unterschrieben zu den Schulungsunterlagen nehmen.<\u002Fp>\n          <\u002Fdiv>\n          <img src=\"64ccacb4-f879-4516-9d96-fc6871ea1eed\" alt=\"Altea\" style=\"width: 180px; height: auto;\">\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n          <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.006 60);\">Name<\u002Fspan>\n            <input type=\"text\" value=\"{{ name }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"Vor- und Nachname\" style=\"font-size: 16px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 6px; padding: 12px 14px;\">\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.006 60);\">Funktion<\u002Fspan>\n            <input type=\"text\" value=\"{{ rolle }}\" sc-camel-on-change=\"{{ setRolle }}\" placeholder=\"Funktion in der Kanzlei\" style=\"font-size: 16px; color: oklch(0.18 0.005 60); background: oklch(0.965 0.004 80); border: 1px solid oklch(0.90 0.006 78); border-radius: 6px; padding: 12px 14px;\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; border-top: 1px solid oklch(0.90 0.006 78); padding-top: 22px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.006 60);\">Bearbeitete Module<\u002Fspan>\n            <span style=\"font-size: 18px;\">{{ fortschrittText }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.006 60);\">Testergebnis<\u002Fspan>\n            <span style=\"font-size: 18px;\">{{ ergebnis }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.006 60);\">Datum<\u002Fspan>\n            <span style=\"font-size: 18px;\">{{ heute }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; border-top: 1px solid oklch(0.90 0.006 78); padding-top: 26px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 34px; flex: 1;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.006 60);\">Unterschrift<\u002Fspan>\n            <div style=\"border-bottom: 1px solid oklch(0.84 0.008 78); max-width: 420px;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ drucken }}\" style=\"font-size: 16px; color: oklch(0.99 0.005 80); background: oklch(0.58 0.13 35); border: 1px solid oklch(0.30 0.005 60); border-radius: 6px; padding: 13px 24px; cursor: pointer;\" style-hover=\"background: oklch(0.52 0.13 35);\" class=\"no-print\">Nachweis drucken<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <footer style=\"padding: 32px 0 0; display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: oklch(0.58 0.006 60);\">Quellen<\u002Fdiv>\n        <p style=\"font-size: 14px; line-height: 1.7; color: oklch(0.58 0.006 60); margin: 0; max-width: 92ch;\">Verordnung (EU) 2024/1689 (KI-VO), Art. 4, 5, 25, 26, 50, 86, 99 und 113. Verordnung (EU) 2026/1744 (Digital Omnibus on AI), in Kraft seit dem 27. Juli 2026. Leitlinien der Kommission zu verbotenen Praktiken, Februar 2025, und zu den Transparenzpflichten, 20. Juli 2026. Verordnung (EU) 2016/679 (DSGVO), Art. 5, 32 und 35. Italienisches Gesetz 132/2025. Stand: August 2026 — der Kurs ist zu überarbeiten, wenn sich die eingesetzten Werkzeuge ändern, jedenfalls vor dem 2. Dezember 2027.<\u002Fp>\n      <\u002Ffooter>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst BANK_DE = [\n{ id: 1, stem: \"Eine Kanzlei integriert ein Fremdmodell in ein Werkzeug, das für einen HR-Mandanten automatisch Bewerber auswählt. Welche Rolle übernimmt die Kanzlei nach der KI-VO?\", opts: [\"Bleibt Betreiber, da sie das Modell nicht entwickelt hat\", \"Wird Anbieter nach Art. 25, wegen der Hochrisiko-Zweckbestimmung\", \"Keine zusätzliche Pflicht, das Basismodell stammt von Dritten\"], correct: 1, expl: \"Art. 25 macht denjenigen zum Anbieter, der ein System einer Hochrisiko-Zweckbestimmung zuführt, auch wenn es auf einem Fremdmodell basiert.\" },\n{ id: 2, stem: \"Ein Mandant möchte einen Zuverlässigkeits-Score für Gegenparteien in einem Verfahren berechnen, basierend auf öffentlichen, für die Sache nicht einschlägigen Daten. Wie ist das zu qualifizieren?\", opts: [\"Zulässig, wenn der Score nur indikativ ist\", \"Social Scoring, verboten nach Art. 5, unabhängig vom konkreten Verwendungszweck\", \"Hochrisiko-System, zulässig mit menschlicher Aufsicht\"], correct: 1, expl: \"Social Scoring ist nach Art. 5 als solches verboten, unabhängig vom erklärten Zweck oder der tatsächlichen Nutzung.\" },\n{ id: 3, stem: \"Ein Chatbot auf der Website antwortet so, dass kein durchschnittlicher Nutzer daran zweifeln würde, mit einem Menschen zu sprechen. Ist die Offenlegung nach Art. 50 erforderlich?\", opts: [\"Nein, wenn die Antworten korrekt sind\", \"Ja, immer, außer es ist aus dem Kontext offensichtlich, dass es sich um ein KI-System handelt\", \"Nur wenn der Chatbot personenbezogene Daten erhebt\"], correct: 1, expl: \"Art. 50 verlangt die Offenlegung, sofern es nicht aus dem Kontext offensichtlich ist, dass ein KI-System antwortet.\" },\n{ id: 4, stem: \"Ein Hochrisiko-System erzeugt automatische Protokolle. Eine Fachvorschrift verlangt für dieselbe Tätigkeit eine zehnjährige Aufbewahrung. Welche Frist gilt?\", opts: [\"Die längere, in der Fachvorschrift vorgesehene Frist\", \"Immer sechs Monate, einheitlich nach Art. 26(6)\", \"Keine Pflicht, wenn der Anbieter sie nicht verlangt\"], correct: 0, expl: \"Sieht eine Fachvorschrift eine längere Aufbewahrung vor, geht diese dem sechsmonatigen Minimum aus Art. 26(6) vor.\" },\n{ id: 5, stem: \"Ein von KI generierter Text wird von einer Anwältin inhaltlich geprüft, korrigiert und als eigenes Gutachten unterschrieben. Muss offengelegt werden, dass er KI-generiert ist?\", opts: [\"Nein: Art. 50 verlangt keine Offenlegung des Werkzeugs, wenn menschliche Prüfung und redaktionelle Verantwortung vorliegen\", \"Ja, immer, aus Gründen der Transparenz gegenüber dem Mandanten\", \"Nur wenn der Mandant ausdrücklich danach fragt\"], correct: 0, expl: \"Art. 50 verlangt keine Offenlegung des genutzten Werkzeugs, wenn eine menschliche Prüfung und redaktionelle Verantwortung für den Inhalt vorliegt.\" },\n{ id: 6, stem: \"Ein Unternehmen führt ein Hochrisiko-System zur Personalauswahl ein. An wen richtet sich die vorherige Information nach Art. 26(7)?\", opts: [\"An die Arbeitnehmervertretung und die betroffenen Arbeitnehmer, nach den Verfahren des Unions- und nationalen Rechts\", \"Nur an die direkt bewerteten Bewerber\", \"An niemanden, wenn der Anbieter das Unternehmen bereits informiert hat\"], correct: 0, expl: \"Art. 26(7) verlangt, sowohl die Arbeitnehmervertretung als auch die unmittelbar betroffenen Arbeitnehmer vor der Nutzung zu informieren.\" },\n{ id: 7, stem: \"Ein Prompt schreibt „Mandant A, geboren 1975, IBAN pseudonymisiert XXX\\\", enthält aber eine so spezifische Sachverhaltsbeschreibung, dass jeder, der den Fall kennt, die Person erkennt. Reicht das für die DSGVO aus?\", opts: [\"Ja, die direkten identifizierenden Daten wurden entfernt\", \"Nein: die Pseudonymisierung beseitigt die indirekte Erkennbarkeit nicht, die weiterhin eine Verarbeitung personenbezogener Daten darstellt\", \"Ja, wenn das Modell die Konversation nicht speichert\"], correct: 1, expl: \"Pseudonymisierung genügt nicht, wenn der Kontext einzigartig und erkennbar bleibt: es handelt sich weiterhin um eine Verarbeitung personenbezogener Daten nach der DSGVO.\" },\n{ id: 8, stem: \"Eine Kanzlei passt ein allgemeines, nicht rechtsspezifisches KI-Modell an, um automatisch generierte Gutachten als „KI-Rechtsratgeber\\\" online zu veröffentlichen. Was verlangt Art. 50 hier?\", opts: [\"Keine Pflicht, da das Basismodell kein Hochrisiko-System ist\", \"Die Kennzeichnung als KI-generiert, außer bei menschlicher Prüfu
